services:
  - type: web
    name: personal-backend
    runtime: node
    plan: free
    region: virginia
    buildCommand: npm ci && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_NAME
        value: personal
      - key: APP_KEY
        generateValue: true
      - key: FRONTEND_APP_URL
        sync: false
